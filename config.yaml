# These are the same options as on https://raphaelteo.github.io/healthhub-appt-finder/,
# which also shows which polyclinics offer each appointment type.

# Appointment types to search for, one or more (must match the site's wording;
# case-insensitive).
# Available options:
#   Doctor Consultation
#     - Doctor Consultation
#   Healthier SG
#     - Health Plan Discussion
#     - Healthier@SG Consult
#   Video Consultation (via Zoom) For patients age 18 and above only
#     - Doctor Consult for General Conditions (SingHealth Polyclinics)
#       (cannot be searched: it has no location or date to choose)
#     - Chronic Conditions and Family Planning Follow-up
#   Nursing
#     - Adult Vaccination (Excludes Flu Vaccination)
#     - Vaccination Clinic (7 years and above)
#     - Postnatal Care
#     - Advanced Practice Nurse (For Existing APN Patients)
#     - Child Vaccination (Age 6 Months to 17 Years)
#     - COVID Vaccination (Age 12 Years & above)
#     - COVID Vaccination (Age 5 to 11 Years)
#     - COVID Vaccination (Age 6 Months to 4 Years)
#     - Dressing
#     - Flu Vaccination
#   Screening
#     - Cervical Cancer Screening
#     - Bone Mineral Densitometry (BMD)
#     - Childhood Developmental Screening
#     - Driving Licence Medical Examination
#     - Diabetic Eye Screening
#     - Foot Screening for Diabetes Patients
#     - Mammogram Screening
#     - Assessment for Mobility Scooter
#     - Ultrasound
#     - Spirometry
#   Antenatal and Children's Health
#     - Antenatal Care
#     - Lactation Support Service
#     - Newborn Jaundice Screening
#   Allied Health
#     - Financial Counselling
#     - Medical Social Service
#     - Physiotherapy Service
#   Dental
#     - Dental Cleaning (Scaling & Polishing)
#   Allied Health Led Preventive Health
#     - Advance Care Planning
#     - New Weight New Me
appointment_types:
  - "Dental Cleaning (Scaling & Polishing)"

# Polyclinics to search. Leave empty ([]) to search every polyclinic that offers
# the appointment type.
# Available options for "Dental Cleaning (Scaling & Polishing)" (other types are
# offered at other polyclinics; one that does not offer a type is reported as
# "not offered for this appointment type"):
#   - Ang Mo Kio Polyclinic
#   - Bedok Polyclinic
#   - Bukit Panjang Polyclinic
#   - Eunos Polyclinic
#   - Geylang Polyclinic
#   - Hougang Polyclinic
#   - Jurong Polyclinic
#   - Khatib Polyclinic
#   - Pasir Ris Polyclinic
#   - Punggol Polyclinic
#   - Queenstown Polyclinic
#   - Serangoon Polyclinic
#   - Tampines Polyclinic
#   - Toa Payoh Polyclinic
#   - Woodlands Polyclinic
locations:
  - "Serangoon Polyclinic"

# Months to search, counted from the current month: 0 is this month (from
# today), 1 is next month, and so on. They need not be next to each other
# (e.g. run in Oct with [0, 2] -> searches the rest of Oct, and Dec).
months: [0, 1, 2]
